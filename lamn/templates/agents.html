{% extends "base.html" %}
{% block title %}Agents &middot; lamn{% endblock %}
{% block content %}
<div class="panel">
  <h1>Configured agents</h1>
  <p class="muted">
    Edit the list via CLI: <code>lamn add &lt;ip&gt;</code> / <code>lamn remove &lt;ip&gt;</code>.
    Source: <code>~/.agents.json</code>.
  </p>
  <table>
    <thead>
      <tr>
        <th>IP</th>
        <th>Hostname</th>
        <th>Status</th>
        <th>Last good update</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<script>
const AGENTS = {{ agents|tojson }};
function statusPill(st) {
  if (st === "online")  return '<span class="pill ok">online</span>';
  if (st === "stale")   return '<span class="pill warn">stale</span>';
  if (st === "offline") return '<span class="pill err">offline</span>';
  return '<span class="pill">unseen</span>';
}
async function refresh() {
  const res = await fetch('/metrics');
  const data = await res.json();
  const tbody = document.getElementById('rows');
  let html = "";
  for (const ip of AGENTS) {
    const e = data[ip] || {};
    const st = e._status || (e._last_success ? "stale" : "unknown");
    const rowCls = st === "stale" ? "stale" : st === "offline" ? "offline" : "";
    const host = (e.host || "").split(".")[0] || "–";
    html += `<tr class="${rowCls}">
      <td><a class="row-link" href="/host/${encodeURIComponent(ip)}">${ip}</a></td>
      <td>${host}</td>
      <td>${statusPill(st)}</td>
      <td class="muted">${e._last_success || ''}</td>
      <td><a class="row-link" href="/host/${encodeURIComponent(ip)}">details &rarr;</a></td>
    </tr>`;
  }
  if (!AGENTS.length) {
    html = '<tr><td colspan="5" class="muted">No agents configured.</td></tr>';
  }
  tbody.innerHTML = html;
}
refresh();
setInterval(refresh, 5000);
</script>
{% endblock %}
