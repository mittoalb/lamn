<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAN System Monitor Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000000;
      color: #e4e4e7;
      min-height: 100vh;
      padding: 0;
    }
    
    .container {
      max-width: 1600px;
      margin: 0 auto;
    }
    
    .header {
      background: linear-gradient(180deg, #0a0a0a 0%, #000000 100%);
      border-bottom: 1px solid #1f1f1f;
      padding: 32px 40px;
    }
    
    .header h1 {
      font-size: 28px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.5px;
    }
    
    .status-bar {
      background: #0a0a0a;
      border-bottom: 1px solid #1f1f1f;
      padding: 16px 40px;
      display: flex;
      gap: 32px;
      align-items: center;
    }
    
    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    
    .status-active { background: #10b981; }
    .status-offline { background: #ef4444; }
    .status-total { background: #6b7280; }
    
    .section {
      padding: 40px;
    }
    
    .machine-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 24px;
      margin-top: 24px;
    }
    
    .machine-card {
      background: #0a0a0a;
      border: 1px solid #1f1f1f;
      border-radius: 8px;
      padding: 24px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .machine-card:hover {
      border-color: #3f3f46;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    
    .machine-card.error {
      background: #1a0a0a;
      border-color: #3f1f1f;
    }
    
    .machine-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #1f1f1f;
    }
    
    .machine-name {
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.3px;
    }
    
    .status-badge {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }
    
    .status-badge.error {
      background: #ef4444;
    }
    
    .error-message {
      color: #fca5a5;
      font-size: 14px;
      padding: 16px;
      background: rgba(239, 68, 68, 0.1);
      border-radius: 6px;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    
    .metrics-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .metric {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .metric-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .metric-label {
      font-size: 13px;
      font-weight: 500;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .metric-value {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
    }
    
    .metric-bar {
      width: 100%;
      height: 4px;
      background: #1f1f1f;
      border-radius: 2px;
      overflow: hidden;
    }
    
    .metric-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .cpu-fill { background: linear-gradient(90deg, #10b981, #059669); }
    .memory-fill { background: linear-gradient(90deg, #3b82f6, #2563eb); }
    .disk-fill { background: linear-gradient(90deg, #f59e0b, #d97706); }
    .gpu-fill { background: linear-gradient(90deg, #8b5cf6, #7c3aed); }
    
    .metric-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      font-size: 14px;
      border-bottom: 1px solid #1f1f1f;
    }
    
    .metric-info:last-child {
      border-bottom: none;
    }
    
    .info-label {
      color: #71717a;
      font-weight: 500;
    }
    
    .info-value {
      color: #d4d4d8;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
    
    .timestamp {
      font-size: 12px;
      color: #52525b;
      text-align: right;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #1f1f1f;
    }
    
    .details-toggle {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: transparent;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      color: #a1a1aa;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .details-toggle:hover {
      background: #1f1f1f;
      border-color: #52525b;
      color: #ffffff;
    }
    
    .details-content {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: #050505;
      border: 1px solid #1f1f1f;
      border-radius: 6px;
    }
    
    .details-content.show {
      display: block;
    }
    
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      font-size: 13px;
      border-bottom: 1px solid #1a1a1a;
    }
    
    .detail-row:last-child {
      border-bottom: none;
    }
    
    .detail-label {
      color: #71717a;
      font-weight: 500;
    }
    
    .detail-value {
      color: #d4d4d8;
      font-weight: 500;
      text-align: right;
    }
    
    .detail-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #1f1f1f;
    }
    
    .detail-section-title {
      font-size: 12px;
      font-weight: 600;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    
    @media (max-width: 1200px) {
      .machine-grid {
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      }
    }
    
    @media (max-width: 768px) {
      .machine-grid {
        grid-template-columns: 1fr;
      }
      
      .section {
        padding: 24px 20px;
      }
      
      .header {
        padding: 24px 20px;
      }
      
      .status-bar {
        padding: 16px 20px;
        flex-wrap: wrap;
        gap: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>System Monitor</h1>
    </div>
    
    <div class="status-bar" id="statusBar">
      <div class="status-item">
        <div class="status-dot status-active"></div>
        <span id="activeCount">0 Active</span>
      </div>
      <div class="status-item">
        <div class="status-dot status-offline"></div>
        <span id="offlineCount">0 Offline</span>
      </div>
      <div class="status-item">
        <div class="status-dot status-total"></div>
        <span id="totalCount">0 Total</span>
      </div>
    </div>
    
    <div class="section">
      <div class="machine-grid" id="machineGrid">
        <!-- Machine cards will be injected here -->
      </div>
    </div>
  </div>

  <script>
    function formatBytes(bytes, decimals = 1) {
      if (bytes === 0 || bytes === null) return '0 B';
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    function toggleDetails(cardId) {
      const detailsContent = document.getElementById('details-' + cardId);
      detailsContent.classList.toggle('show');
    }

    function buildSpecsHTML(specs) {
      if (!specs) return '<div class="detail-row"><span class="detail-label">No specifications available</span></div>';
      
      let html = "";
      
      html += `<div class="detail-row"><span class="detail-label">CPU</span><span class="detail-value">${specs.cpu || 'N/A'}</span></div>`;
      html += `<div class="detail-row"><span class="detail-label">GPU</span><span class="detail-value">${specs.gpu || 'N/A'}</span></div>`;
      html += `<div class="detail-row"><span class="detail-label">Total RAM</span><span class="detail-value">${formatBytes(specs.ram)}</span></div>`;

      if (specs.os) {
        html += `<div class="detail-row"><span class="detail-label">Operating System</span><span class="detail-value">${specs.os.system} ${specs.os.release}</span></div>`;
      }

      if (specs.disk_summary) {
        html += `<div class="detail-section">`;
        html += `<div class="detail-section-title">Storage</div>`;
        html += `<div class="detail-row"><span class="detail-label">Used</span><span class="detail-value">${specs.disk_summary.total_used_human}</span></div>`;
        html += `<div class="detail-row"><span class="detail-label">Free</span><span class="detail-value">${specs.disk_summary.total_free_human}</span></div>`;
        html += `<div class="detail-row"><span class="detail-label">Total</span><span class="detail-value">${specs.disk_summary.total_space_human}</span></div>`;
        html += `</div>`;
      }

      if (specs.connectivity) {
        html += `<div class="detail-section">`;
        html += `<div class="detail-section-title">Network</div>`;
        for (let iface in specs.connectivity) {
          let item = specs.connectivity[iface];
          let speedDisplay = (item.speed && item.speed > 0 && item.speed < 65535) ? item.speed + " Mbps" : "N/A";
          html += `<div class="detail-row"><span class="detail-label">${iface}</span><span class="detail-value">${item.addresses[0] || 'N/A'}</span></div>`;
          if (speedDisplay !== "N/A") {
            html += `<div class="detail-row"><span class="detail-label">Link Speed</span><span class="detail-value">${speedDisplay}</span></div>`;
          }
        }
        html += `</div>`;
      }

      return html;
    }

    async function fetchMetrics() {
      try {
        const response = await fetch('/metrics');
        const data = await response.json();
        const machineGrid = document.getElementById("machineGrid");
        
        machineGrid.innerHTML = "";
        
        const totalMachines = Object.keys(data).length;
        const errorCount = Object.values(data).filter(entry => entry.error).length;
        const activeCount = totalMachines - errorCount;
        
        document.getElementById('activeCount').textContent = `${activeCount} Active`;
        document.getElementById('offlineCount').textContent = `${errorCount} Offline`;
        document.getElementById('totalCount').textContent = `${totalMachines} Total`;

        for (let ip in data) {
          const entry = data[ip];
          const safeId = ip.replace(/\./g, "_");
          const card = document.createElement('div');
          card.className = 'machine-card' + (entry.error ? ' error' : '');
          
          if (entry.error) {
            card.innerHTML = `
              <div class="machine-header">
                <div class="machine-name">${ip}</div>
                <div class="status-badge error"></div>
              </div>
              <div class="error-message">
                ${entry.error}
              </div>
            `;
          } else {
            let rawHost = entry.host || ip;
            let cleanHost = rawHost.split(".")[0];
            const diskSummary = entry.specs?.disk_summary;
            
            const cpuPercent = entry.cpu !== undefined ? entry.cpu : 0;
            const memoryPercent = entry.memory !== undefined ? entry.memory : 0;
            const diskPercent = diskSummary ? diskSummary.percent_used : 0;
            const gpuPercent = entry.gpu !== null && entry.gpu !== undefined ? entry.gpu : 0;
            
            card.innerHTML = `
              <div class="machine-header">
                <div class="machine-name">${cleanHost}</div>
                <div class="status-badge"></div>
              </div>
              
              <div class="metrics-group">
                <div class="metric">
                  <div class="metric-header">
                    <span class="metric-label">CPU</span>
                    <span class="metric-value">${cpuPercent.toFixed(1)}%</span>
                  </div>
                  <div class="metric-bar">
                    <div class="metric-fill cpu-fill" style="width: ${Math.min(cpuPercent, 100)}%"></div>
                  </div>
                </div>
                
                <div class="metric">
                  <div class="metric-header">
                    <span class="metric-label">Memory</span>
                    <span class="metric-value">${memoryPercent.toFixed(1)}%</span>
                  </div>
                  <div class="metric-bar">
                    <div class="metric-fill memory-fill" style="width: ${Math.min(memoryPercent, 100)}%"></div>
                  </div>
                </div>
                
                <div class="metric">
                  <div class="metric-header">
                    <span class="metric-label">Disk</span>
                    <span class="metric-value">${diskPercent.toFixed(1)}%</span>
                  </div>
                  <div class="metric-bar">
                    <div class="metric-fill disk-fill" style="width: ${Math.min(diskPercent, 100)}%"></div>
                  </div>
                </div>
                
                <div class="metric">
                  <div class="metric-header">
                    <span class="metric-label">GPU</span>
                    <span class="metric-value">${gpuPercent.toFixed(1)}%</span>
                  </div>
                  <div class="metric-bar">
                    <div class="metric-fill gpu-fill" style="width: ${Math.min(gpuPercent, 100)}%"></div>
                  </div>
                </div>
              </div>
              
              <div style="margin-top: 20px;">
                <div class="metric-info">
                  <span class="info-label">Disk Read</span>
                  <span class="info-value">${entry.disk_read_bytes !== undefined ? formatBytes(entry.disk_read_bytes) : 'N/A'}</span>
                </div>
                <div class="metric-info">
                  <span class="info-label">Disk Write</span>
                  <span class="info-value">${entry.disk_write_bytes !== undefined ? formatBytes(entry.disk_write_bytes) : 'N/A'}</span>
                </div>
                <div class="metric-info">
                  <span class="info-label">Available Space</span>
                  <span class="info-value">${diskSummary ? `${diskSummary.total_free_human} / ${diskSummary.total_space_human}` : 'N/A'}</span>
                </div>
              </div>
              
              <div class="timestamp">${entry.timestamp || 'N/A'}</div>
              
              <button class="details-toggle" onclick="toggleDetails('${safeId}')">
                Hardware Specifications
              </button>
              
              <div class="details-content" id="details-${safeId}">
                ${entry.specs ? buildSpecsHTML(entry.specs) : '<div class="detail-row"><span class="detail-label">No specifications available</span></div>'}
              </div>
            `;
          }
          
          machineGrid.appendChild(card);
        }
      } catch (error) {
        console.error("Error fetching metrics:", error);
      }
    }

    setInterval(fetchMetrics, 5000);
    fetchMetrics();
  </script>
</body>
</html>
