<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}lamn{% endblock %}</title>
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #14181d;
      --panel-2: #1b2027;
      --ink: #e6edf3;
      --muted: #8b949e;
      --border: #262c33;
      --accent: #58a6ff;
      --ok: #3fb950;
      --warn: #d29922;
      --err: #f85149;
    }
    * { box-sizing: border-box; }
    html, body { background: var(--bg); }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--ink);
      min-height: 100vh;
    }
    a { color: var(--accent); }
    header {
      background: #0f1317;
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    header .brand {
      font-weight: 700;
      font-size: 1.15em;
      letter-spacing: 0.5px;
      color: var(--ink);
    }
    nav a {
      color: var(--muted);
      text-decoration: none;
      margin-right: 18px;
      font-size: 0.95em;
      padding-bottom: 3px;
      border-bottom: 2px solid transparent;
    }
    nav a:hover { color: var(--ink); }
    nav a.active { color: var(--ink); border-bottom-color: var(--accent); }
    .container {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 20px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    h1, h2 { margin-top: 0; color: var(--ink); }
    h2 { font-size: 1.1em; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95em;
    }
    thead th {
      background: var(--panel-2);
      color: var(--ink);
      padding: 10px;
      text-align: left;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
    }
    tbody td {
      padding: 10px;
      border-bottom: 1px solid var(--border);
    }
    tbody tr:hover { background: var(--panel-2); }
    tr.stale td { color: var(--muted); }
    tr.offline td { color: #5a6169; }
    a.row-link { color: var(--accent); text-decoration: none; }
    a.row-link:hover { text-decoration: underline; }
    .ok { color: var(--ok); font-weight: 600; }
    .warn { color: var(--warn); font-weight: 600; }
    .err { color: var(--err); font-weight: 600; }
    .muted { color: var(--muted); }
    .bar {
      display: inline-block;
      width: 80px;
      height: 8px;
      background: #262c33;
      border-radius: 4px;
      vertical-align: middle;
      margin-left: 8px;
      overflow: hidden;
    }
    .bar > span {
      display: block;
      height: 100%;
      background: var(--accent);
    }
    .bar > span.warn { background: var(--warn); }
    .bar > span.hot { background: var(--err); }
    .kv { display: grid; grid-template-columns: 180px 1fr; row-gap: 6px; font-size: 0.95em; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; color: var(--ink); }
    code { background: #0f1317; padding: 2px 5px; border-radius: 3px; font-size: 0.9em; color: #c9d1d9; border: 1px solid var(--border); }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.78em;
      background: #21262d;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .pill.ok { background: rgba(63,185,80,0.15); color: var(--ok); border-color: rgba(63,185,80,0.4); }
    .pill.warn { background: rgba(210,153,34,0.15); color: var(--warn); border-color: rgba(210,153,34,0.4); }
    .pill.err { background: rgba(248,81,73,0.15); color: var(--err); border-color: rgba(248,81,73,0.4); }
    footer {
      color: var(--muted);
      text-align: center;
      font-size: 0.85em;
      padding: 20px 0 40px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">lamn</div>
    <nav>
      <a href="/" class="{% if active=='dashboard' %}active{% endif %}">Dashboard</a>
      <a href="/agents" class="{% if active=='agents' %}active{% endif %}">Agents</a>
      <a href="/metrics" class="{% if active=='api' %}active{% endif %}">/metrics (JSON)</a>
    </nav>
  </header>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  <footer>lamn &middot; SSH pull-mode monitor</footer>
</body>
</html>
