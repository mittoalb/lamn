{% extends "base.html" %}
{% block title %}Dashboard &middot; lamn{% endblock %}
{% block content %}
<div class="panel">
  <h1>Live metrics</h1>
  <p class="muted">Polling every <span id="pollEvery">5</span>s &middot;
    last refresh <span id="lastUpdated">–</span></p>
  <table>
    <thead>
      <tr>
        <th>Host</th>
        <th>CPU</th>
        <th>Memory</th>
        <th>GPU</th>
        <th>Disk used</th>
        <th>Free / Total</th>
        <th>Updated</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<script>
function bar(pct) {
  if (pct === null || pct === undefined || isNaN(pct)) return "<span class='muted'>N/A</span>";
  const p = Math.max(0, Math.min(100, Number(pct)));
  const cls = p >= 90 ? "hot" : p >= 75 ? "warn" : "";
  return `${p.toFixed(1)}%<span class="bar"><span class="${cls}" style="width:${p}%"></span></span>`;
}
function shortHost(h, ip) { return h ? h.split(".")[0] : ip; }
function ago(ts) {
  if (!ts) return "";
  const t = new Date(ts);
  const s = Math.floor((Date.now() - t.getTime()) / 1000);
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  return `${Math.floor(s/3600)}h ago`;
}
function statusPill(e) {
  const st = e._status || (e._last_success ? "stale" : "unknown");
  if (st === "online")  return '<span class="pill ok">online</span>';
  if (st === "stale")   return '<span class="pill warn" title="poll failed, showing last known">stale</span>';
  if (st === "offline") return '<span class="pill err">offline</span>';
  return '<span class="pill">unknown</span>';
}

async function refresh() {
  const res = await fetch('/metrics');
  const data = await res.json();
  const tbody = document.getElementById('rows');
  const ips = Object.keys(data).sort();
  let html = "";
  for (const ip of ips) {
    const e = data[ip];
    const st = e._status || (e._last_success ? "stale" : "unknown");
    const rowCls = st === "stale" ? "stale" : st === "offline" ? "offline" : "";
    const hasData = e._last_success || (e.host && e.cpu !== undefined);

    if (!hasData) {
      html += `<tr class="${rowCls}">
        <td><a class="row-link" href="/host/${encodeURIComponent(ip)}">${ip}</a></td>
        <td colspan="6" class="err">${e._last_error || "no data yet"}</td>
        <td>${statusPill(e)}</td>
      </tr>`;
      continue;
    }

    const host = shortHost(e.host, ip);
    const ds = (e.specs && e.specs.disk_summary) || {};
    const free = ds.total_free_human || e.disk_free || "N/A";
    const total = ds.total_space_human || e.disk_total || "N/A";
    const diskPct = ds.percent_used ?? e.disk_percent_used;
    html += `<tr class="${rowCls}">
      <td><a class="row-link" href="/host/${encodeURIComponent(ip)}">${host}</a>
        <div class="muted" style="font-size:0.8em">${ip}</div></td>
      <td>${bar(e.cpu)}</td>
      <td>${bar(e.memory)}</td>
      <td>${bar(e.gpu)}</td>
      <td>${bar(diskPct)}</td>
      <td>${free} / ${total}</td>
      <td class="muted" title="${e._last_success || ''}">${ago(e._last_success || e.timestamp)}</td>
      <td>${statusPill(e)}</td>
    </tr>`;
  }
  tbody.innerHTML = html || '<tr><td colspan="8" class="muted">No agents configured. Add one with <code>lamn add &lt;ip&gt;</code>.</td></tr>';
  document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();
}
refresh();
setInterval(refresh, 5000);
</script>
{% endblock %}
