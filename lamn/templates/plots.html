<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Resource Monitor - Hybrid Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000000;
            color: #e4e4e7;
            min-height: 100vh;
            padding: 0;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .header {
            background: linear-gradient(180deg, #0a0a0a 0%, #000000 100%);
            border-bottom: 1px solid #1f1f1f;
            padding: 32px 40px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        
        .header p {
            font-size: 14px;
            color: #a1a1aa;
            font-weight: 500;
        }
        
        .controls {
            background: #0a0a0a;
            border-bottom: 1px solid #1f1f1f;
            padding: 20px 40px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .btn {
            background: transparent;
            border: 1px solid #3f3f46;
            color: #a1a1aa;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn:hover {
            background: #1f1f1f;
            border-color: #52525b;
            color: #ffffff;
        }
        
        .status-bar {
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            padding: 12px 40px;
            text-align: center;
            font-weight: 500;
            font-size: 14px;
            border-bottom: 1px solid rgba(16, 185, 129, 0.2);
        }
        
        .section {
            padding: 40px;
            border-bottom: 1px solid #1f1f1f;
        }
        
        .section h2 {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.3px;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid #1f1f1f;
        }
        
        /* Machine Cards */
        .machine-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        
        .machine-card {
            background: #0a0a0a;
            border: 1px solid #1f1f1f;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .machine-card:hover {
            border-color: #3f3f46;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        
        .machine-name {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #1f1f1f;
            letter-spacing: -0.3px;
        }
        
        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0;
            padding: 8px 0;
        }
        
        .metric-name {
            font-weight: 500;
            color: #71717a;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .metric-value {
            font-weight: 600;
            font-size: 15px;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }
        
        .metric-bar {
            width: 100px;
            height: 4px;
            background: #1f1f1f;
            border-radius: 2px;
            overflow: hidden;
            margin-left: 10px;
        }
        
        .metric-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .cpu-fill { background: linear-gradient(90deg, #10b981, #059669); }
        .memory-fill { background: linear-gradient(90deg, #3b82f6, #2563eb); }
        .disk-fill { background: linear-gradient(90deg, #f59e0b, #d97706); }
        .gpu-fill { background: linear-gradient(90deg, #8b5cf6, #7c3aed); }
        
        /* Charts */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 24px;
            margin-top: 24px;
        }
        
        .chart-container {
            background: #0a0a0a;
            border: 1px solid #1f1f1f;
            border-radius: 8px;
            padding: 24px;
        }
        
        .chart-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            color: #ffffff;
            letter-spacing: -0.3px;
        }
        
        .chart-svg {
            width: 100%;
            height: 250px;
            border: 1px solid #1f1f1f;
            border-radius: 6px;
            background: #050505;
        }
        
        .chart-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            margin-top: 16px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #a1a1aa;
            font-weight: 500;
        }
        
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
        
        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #0a0a0a;
            border: 1px solid #1f1f1f;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 24px;
        }
        
        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #1a1a1a;
            font-size: 13px;
        }
        
        th {
            background: #050505;
            font-weight: 600;
            color: #a1a1aa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 12px;
        }
        
        td {
            color: #d4d4d8;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }
        
        tbody tr {
            transition: background 0.2s ease;
        }
        
        tbody tr:hover {
            background: #0f0f0f;
        }
        
        tbody tr:last-child td {
            border-bottom: none;
        }
        
        @media (max-width: 1200px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .section {
                padding: 24px 20px;
            }
            
            .header {
                padding: 24px 20px;
            }
            
            .controls {
                padding: 16px 20px;
            }
            
            .machine-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Machine Resource Monitor</h1>
            <p>Hybrid Dashboard</p>
        </div>
        
        <div class="controls">
            <button class="btn" onclick="loadData()">Refresh Data</button>
            <a href="/download_csv" class="btn">Download CSV</a>
            <a href="/csv_summary" class="btn" target="_blank">View Summary</a>
        </div>
        
        <div id="statusBar" class="status-bar">Ready to load data...</div>
        
        <div class="section">
            <h2>Current Machine Status</h2>
            <div id="machineGrid" class="machine-grid">
                <!-- Machine cards will be inserted here -->
            </div>
        </div>
        
        <div class="section">
            <h2>Performance Trends</h2>
            <div class="charts-grid">
                <div class="chart-container">
                    <div class="chart-title">CPU Usage</div>
                    <svg id="cpuChart" class="chart-svg"></svg>
                    <div id="cpuLegend" class="chart-legend"></div>
                </div>
                
                <div class="chart-container">
                    <div class="chart-title">Memory Usage</div>
                    <svg id="memoryChart" class="chart-svg"></svg>
                    <div id="memoryLegend" class="chart-legend"></div>
                </div>
                
                <div class="chart-container">
                    <div class="chart-title">Disk Usage</div>
                    <svg id="diskChart" class="chart-svg"></svg>
                    <div id="diskLegend" class="chart-legend"></div>
                </div>
                
                <div class="chart-container">
                    <div class="chart-title">GPU Usage</div>
                    <svg id="gpuChart" class="chart-svg"></svg>
                    <div id="gpuLegend" class="chart-legend"></div>
                </div>
            </div>
        </div>
        
        <div class="section">
            <h2>Detailed Information</h2>
            <table>
                <thead>
                    <tr>
                        <th>Machine</th>
                        <th>Last Update</th>
                        <th>CPU</th>
                        <th>Memory</th>
                        <th>Disk</th>
                        <th>GPU</th>
                        <th>Memory GB</th>
                        <th>Disk GB</th>
                    </tr>
                </thead>
                <tbody id="detailBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let csvData = [];
        
        // Color palette for machine lines
        const machineColors = [
            '#10b981', '#3b82f6', '#f59e0b', '#8b5cf6',
            '#ef4444', '#14b8a6', '#f97316', '#ec4899'
        ];
        
        async function loadData() {
            const statusBar = document.getElementById('statusBar');
            statusBar.textContent = 'Loading CSV data...';
            statusBar.style.background = 'rgba(59, 130, 246, 0.1)';
            statusBar.style.color = '#60a5fa';
            statusBar.style.borderBottomColor = 'rgba(59, 130, 246, 0.2)';
            
            try {
                const response = await fetch('/csv_data');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                csvData = await response.json();
                console.log('CSV data loaded:', csvData.length, 'entries');
                
                if (csvData.length === 0) {
                    throw new Error('No data available in CSV');
                }
                
                updateDisplay();
                
                statusBar.textContent = `Data loaded: ${csvData.length} entries from ${getUniqueHostnames().length} machines`;
                statusBar.style.background = 'rgba(16, 185, 129, 0.1)';
                statusBar.style.color = '#34d399';
                statusBar.style.borderBottomColor = 'rgba(16, 185, 129, 0.2)';
                
            } catch (error) {
                console.error('Error loading data:', error);
                statusBar.textContent = `Error: ${error.message}`;
                statusBar.style.background = 'rgba(239, 68, 68, 0.1)';
                statusBar.style.color = '#fca5a5';
                statusBar.style.borderBottomColor = 'rgba(239, 68, 68, 0.2)';
            }
        }
        
        function getUniqueHostnames() {
            return [...new Set(csvData.map(row => row.hostname))];
        }
        
        function updateDisplay() {
            updateMachineCards();
            updateCharts();
            updateDetailTable();
        }
        
        function updateMachineCards() {
            const machineGrid = document.getElementById('machineGrid');
            machineGrid.innerHTML = '';
            
            const hostnames = getUniqueHostnames();
            
            hostnames.forEach(hostname => {
                const machineData = csvData
                    .filter(row => row.hostname === hostname)
                    .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))[0];
                
                if (!machineData) return;
                
                const card = document.createElement('div');
                card.className = 'machine-card';
                card.innerHTML = `
                    <div class="machine-name">${hostname}</div>
                    
                    <div class="metric">
                        <span class="metric-name">CPU</span>
                        <div style="display: flex; align-items: center;">
                            <span class="metric-value">${machineData.cpu_percent.toFixed(1)}%</span>
                            <div class="metric-bar">
                                <div class="metric-fill cpu-fill" style="width: ${Math.min(machineData.cpu_percent, 100)}%"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="metric">
                        <span class="metric-name">Memory</span>
                        <div style="display: flex; align-items: center;">
                            <span class="metric-value">${machineData.memory_percent.toFixed(1)}%</span>
                            <div class="metric-bar">
                                <div class="metric-fill memory-fill" style="width: ${Math.min(machineData.memory_percent, 100)}%"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="metric">
                        <span class="metric-name">Disk</span>
                        <div style="display: flex; align-items: center;">
                            <span class="metric-value">${machineData.disk_percent.toFixed(1)}%</span>
                            <div class="metric-bar">
                                <div class="metric-fill disk-fill" style="width: ${Math.min(machineData.disk_percent, 100)}%"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="metric">
                        <span class="metric-name">GPU</span>
                        <div style="display: flex; align-items: center;">
                            <span class="metric-value">${machineData.gpu_percent.toFixed(1)}%</span>
                            <div class="metric-bar">
                                <div class="metric-fill gpu-fill" style="width: ${Math.min(machineData.gpu_percent, 100)}%"></div>
                            </div>
                        </div>
                    </div>
                `;
                
                machineGrid.appendChild(card);
            });
        }
        
        // Create simple SVG line charts
        function updateCharts() {
            const metrics = [
                { key: 'cpu_percent', chartId: 'cpuChart', legendId: 'cpuLegend' },
                { key: 'memory_percent', chartId: 'memoryChart', legendId: 'memoryLegend' },
                { key: 'disk_percent', chartId: 'diskChart', legendId: 'diskLegend' },
                { key: 'gpu_percent', chartId: 'gpuChart', legendId: 'gpuLegend' }
            ];
            
            const hostnames = getUniqueHostnames();
            
            metrics.forEach(metric => {
                const svg = document.getElementById(metric.chartId);
                const legend = document.getElementById(metric.legendId);
                
                // Clear previous content
                svg.innerHTML = '';
                legend.innerHTML = '';
                
                // Chart dimensions
                const width = 400;
                const height = 200;
                const margin = { top: 20, right: 20, bottom: 40, left: 40 };
                const chartWidth = width - margin.left - margin.right;
                const chartHeight = height - margin.top - margin.bottom;
                
                // Set SVG viewBox for responsiveness
                svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
                
                // Get time range
                const timestamps = csvData.map(d => new Date(d.timestamp));
                const minTime = new Date(Math.min(...timestamps));
                const maxTime = new Date(Math.max(...timestamps));
                const timeRange = maxTime - minTime;
                
                // Only show chart if we have time series data (more than one time point)
                if (timeRange === 0) {
                    svg.innerHTML = `<text x="${width/2}" y="${height/2}" text-anchor="middle" fill="#71717a" font-size="13">No time series data available</text>`;
                    return;
                }
                
                // Create chart background
                svg.innerHTML = `
                    <rect x="${margin.left}" y="${margin.top}" width="${chartWidth}" height="${chartHeight}" 
                          fill="#050505" stroke="#1f1f1f" stroke-width="1"/>
                    
                    <!-- Y-axis grid lines -->
                    <g stroke="#1a1a1a" stroke-width="1">
                        <line x1="${margin.left}" y1="${margin.top + chartHeight * 0.25}" 
                              x2="${margin.left + chartWidth}" y2="${margin.top + chartHeight * 0.25}"/>
                        <line x1="${margin.left}" y1="${margin.top + chartHeight * 0.5}" 
                              x2="${margin.left + chartWidth}" y2="${margin.top + chartHeight * 0.5}"/>
                        <line x1="${margin.left}" y1="${margin.top + chartHeight * 0.75}" 
                              x2="${margin.left + chartWidth}" y2="${margin.top + chartHeight * 0.75}"/>
                    </g>
                    
                    <!-- Y-axis labels -->
                    <text x="${margin.left - 10}" y="${margin.top}" text-anchor="end" fill="#71717a" font-size="11">100%</text>
                    <text x="${margin.left - 10}" y="${margin.top + chartHeight * 0.25}" text-anchor="end" fill="#71717a" font-size="11">75%</text>
                    <text x="${margin.left - 10}" y="${margin.top + chartHeight * 0.5}" text-anchor="end" fill="#71717a" font-size="11">50%</text>
                    <text x="${margin.left - 10}" y="${margin.top + chartHeight * 0.75}" text-anchor="end" fill="#71717a" font-size="11">25%</text>
                    <text x="${margin.left - 10}" y="${margin.top + chartHeight}" text-anchor="end" fill="#71717a" font-size="11">0%</text>
                    
                    <!-- X-axis labels -->
                    <text x="${margin.left}" y="${margin.top + chartHeight + 20}" text-anchor="middle" fill="#71717a" font-size="10">${minTime.toLocaleTimeString()}</text>
                    <text x="${margin.left + chartWidth}" y="${margin.top + chartHeight + 20}" text-anchor="middle" fill="#71717a" font-size="10">${maxTime.toLocaleTimeString()}</text>
                `;
                
                // Draw lines for each machine
                hostnames.forEach((hostname, index) => {
                    const machineData = csvData
                        .filter(row => row.hostname === hostname)
                        .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
                    
                    if (machineData.length < 2) return; // Need at least 2 points for a line
                    
                    const color = machineColors[index % machineColors.length];
                    
                    // Create path
                    let pathData = '';
                    machineData.forEach((point, i) => {
                        const x = margin.left + ((new Date(point.timestamp) - minTime) / timeRange) * chartWidth;
                        const y = margin.top + chartHeight - ((point[metric.key] || 0) / 100) * chartHeight;
                        
                        if (i === 0) {
                            pathData += `M ${x} ${y}`;
                        } else {
                            pathData += ` L ${x} ${y}`;
                        }
                    });
                    
                    // Add line to SVG
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', pathData);
                    path.setAttribute('stroke', color);
                    path.setAttribute('stroke-width', '2');
                    path.setAttribute('fill', 'none');
                    svg.appendChild(path);
                    
                    // Add dots
                    machineData.forEach(point => {
                        const x = margin.left + ((new Date(point.timestamp) - minTime) / timeRange) * chartWidth;
                        const y = margin.top + chartHeight - ((point[metric.key] || 0) / 100) * chartHeight;
                        
                        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                        circle.setAttribute('cx', x);
                        circle.setAttribute('cy', y);
                        circle.setAttribute('r', '3');
                        circle.setAttribute('fill', color);
                        svg.appendChild(circle);
                    });
                    
                    // Add to legend
                    const legendItem = document.createElement('div');
                    legendItem.className = 'legend-item';
                    legendItem.innerHTML = `
                        <div class="legend-color" style="background: ${color}"></div>
                        <span>${hostname}</span>
                    `;
                    legend.appendChild(legendItem);
                });
            });
        }
        
        // Update detail table
        function updateDetailTable() {
            const detailBody = document.getElementById('detailBody');
            detailBody.innerHTML = '';
            
            const hostnames = getUniqueHostnames();
            
            hostnames.forEach(hostname => {
                const machineData = csvData
                    .filter(row => row.hostname === hostname)
                    .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))[0];
                
                if (!machineData) return;
                
                const row = detailBody.insertRow();
                row.insertCell(0).textContent = hostname;
                row.insertCell(1).textContent = new Date(machineData.timestamp).toLocaleString();
                row.insertCell(2).textContent = machineData.cpu_percent.toFixed(1) + '%';
                row.insertCell(3).textContent = machineData.memory_percent.toFixed(1) + '%';
                row.insertCell(4).textContent = machineData.disk_percent.toFixed(1) + '%';
                row.insertCell(5).textContent = machineData.gpu_percent.toFixed(1) + '%';
                row.insertCell(6).textContent = machineData.total_memory_gb.toFixed(1) + ' GB';
                row.insertCell(7).textContent = machineData.total_disk_gb.toFixed(1) + ' GB';
            });
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            
            // Auto-refresh every 30 seconds
            setInterval(loadData, 30000);
        });
    </script>
</body>
</html>
